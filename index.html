<!-- TRADEPILOT PREMIUM VERIFICATION V2 -->
<style>
.pv-box{
  background:#0d1420;
  border:1px solid #263347;
  border-radius:12px;
  padding:18px;
  margin:20px 0;
  color:#edf2fa;
}
.pv-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.pv-box label{
  display:block;
  font-size:12px;
  color:#9ba8bb;
}
.pv-box input,.pv-box select{
  box-sizing:border-box;
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:12px;
  background:#111925;
  color:#fff;
  border:1px solid #263347;
  border-radius:7px;
}
.pv-btn{
  width:100%;
  padding:13px;
  background:#234b87;
  border:0;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.pv-result{
  padding:15px;
  border-radius:9px;
  margin-top:15px;
  background:#111925;
  line-height:1.6;
}
.pv-status{
  font-size:18px;
  font-weight:bold;
}
@media(max-width:600px){
  .pv-grid{grid-template-columns:1fr}
}
</style>

<div class="pv-box" id="premium-verify">
  <h2>CE / PE Premium Verification V2</h2>

  <p style="color:#9ba8bb;font-size:13px">
    Manual data · Same timeframe · Same candle timestamp
  </p>

  <div class="pv-grid">

    <label>Index Candle Direction
      <select id="pv-direction">
        <option value="bullish">Bullish</option>
        <option value="bearish">Bearish</option>
      </select>
    </label>

    <label>Index Candle Value
      <input id="pv-index" type="number" step="0.01"
      placeholder="Enter index candle value">
    </label>

    <label>CE Premium
      <input id="pv-ce" type="number" step="0.01"
      placeholder="Enter CE premium">
    </label>

    <label>PE Premium
      <input id="pv-pe" type="number" step="0.01"
      placeholder="Enter PE premium">
    </label>

    <label>Index Candle Time
      <input id="pv-index-time" type="datetime-local">
    </label>

    <label>Option Candle Time
      <input id="pv-option-time" type="datetime-local">
    </label>

  </div>

  <button class="pv-btn" onclick="runPremiumVerificationV2()">
    VERIFY PREMIUM
  </button>

  <div id="pv-result" class="pv-result">
    <div class="pv-status">WAITING</div>
    Enter candle data to begin verification.
  </div>
</div>

<script>
function runPremiumVerificationV2(){

  const direction = document.getElementById("pv-direction").value;
  const indexInput = document.getElementById("pv-index").value;
  const ceInput = document.getElementById("pv-ce").value;
  const peInput = document.getElementById("pv-pe").value;

  const indexTime = document.getElementById("pv-index-time").value;
  const optionTime = document.getElementById("pv-option-time").value;

  const result = document.getElementById("pv-result");

  function show(status,color,message){
    result.innerHTML =
      "<div class='pv-status' style='color:"+color+"'>"+status+"</div>"+
      "<p>"+message+"</p>";
  }

  // Required fields
  if(indexInput==="" || indexTime==="" || optionTime===""){
    show("WAIT — INCOMPLETE DATA","#f0c66e",
    "Enter index value and both candle timestamps.");
    return;
  }

  const indexValue = Number(indexInput);

  if(!Number.isFinite(indexValue) || indexValue<=0){
    show("INVALID INDEX VALUE","#ff5c70",
    "Index candle value must be greater than zero.");
    return;
  }

  // Timestamp verification
  if(indexTime!==optionTime){
    show("WAIT — TIME MISMATCH","#ff5c70",
    "Index and option candles must have exactly the same timestamp.");
    return;
  }

  // Select CE or PE according to candle direction
  const optionName = direction==="bullish" ? "CE" : "PE";
  const premiumInput = direction==="bullish" ? ceInput : peInput;

  if(premiumInput===""){
    show("WAIT — PREMIUM MISSING","#f0c66e",
    "Enter the "+optionName+" premium for the matching candle.");
    return;
  }

  const premium = Number(premiumInput);

  if(!Number.isFinite(premium) || premium<0){
    show("INVALID PREMIUM","#ff5c70",
    "Selected premium must be a valid non-negative number.");
    return;
  }

  // Existing TradePilot premium rule
  const doubledPremium = premium * 2;
  const verified = doubledPremium >= indexValue;

  if(verified){
    result.innerHTML =
      "<div class='pv-status' style='color:#20d68a'>VERIFIED</div>"+
      "<p>Selected Option: <b>"+optionName+"</b></p>"+
      "<p>Index Value: "+indexValue.toFixed(2)+"</p>"+
      "<p>"+optionName+" Premium: "+premium.toFixed(2)+"</p>"+
      "<p>Premium × 2: "+doubledPremium.toFixed(2)+"</p>"+
      "<p>Timestamp: Matched</p>"+
      "<p>Comparison passed. Verification only — not a trade entry signal.</p>";
  }else{
    result.innerHTML =
      "<div class='pv-status' style='color:#ff5c70'>NOT VERIFIED — WAIT</div>"+
      "<p>Selected Option: <b>"+optionName+"</b></p>"+
      "<p>Index Value: "+indexValue.toFixed(2)+"</p>"+
      "<p>"+optionName+" Premium: "+premium.toFixed(2)+"</p>"+
      "<p>Premium × 2: "+doubledPremium.toFixed(2)+"</p>"+
      "<p>Timestamp: Matched</p>"+
      "<p>Comparison failed. Setup is not verified.</p>";
  }
}
</script>
<!-- END TRADEPILOT PREMIUM VERIFICATION V2 -->
