<!-- TRADEPILOT PREMIUM VERIFICATION MODULE -->
<style>
.pv-box{
 background:#0d1420;border:1px solid #263347;border-radius:12px;
 padding:18px;margin:20px 0;color:#edf2fa
}
.pv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pv-box label{font-size:12px;color:#9ba8bb}
.pv-box input,.pv-box select{
 width:100%;padding:12px;margin-top:6px;margin-bottom:12px;
 background:#111925;color:#fff;border:1px solid #263347;border-radius:7px
}
.pv-btn{
 width:100%;padding:13px;background:#234b87;border:0;
 border-radius:8px;color:white;font-weight:bold;cursor:pointer
}
.pv-result{padding:15px;border-radius:9px;margin-top:15px;background:#111925}
@media(max-width:600px){.pv-grid{grid-template-columns:1fr}}
</style>

<div class="pv-box" id="premium-verify">
<h2>CE / PE Premium Verification</h2>
<p style="color:#9ba8bb;font-size:13px">
Manual verification · Same candle timeframe and timestamp required
</p>

<div class="pv-grid">

<label>Index Candle Direction
<select id="pv-direction">
<option value="bullish">Bullish candle</option>
<option value="bearish">Bearish candle</option>
</select>
</label>

<label>Index Candle Value
<input id="pv-index" type="number" step="0.01" placeholder="e.g. 161.95">
</label>

<label>CE Premium
<input id="pv-ce" type="number" step="0.01" placeholder="e.g. 70.95">
</label>

<label>PE Premium
<input id="pv-pe" type="number" step="0.01" placeholder="Enter PE premium">
</label>

<label>Index Candle Time
<input id="pv-index-time" type="datetime-local">
</label>

<label>Option Premium Candle Time
<input id="pv-option-time" type="datetime-local">
</label>

</div>

<button class="pv-btn" onclick="runPremiumVerification()">
VERIFY PREMIUM
</button>

<div id="pv-result" class="pv-result">
<strong>WAITING FOR INPUT</strong>
<p style="color:#9ba8bb">Enter candle and premium data to run verification.</p>
</div>
</div>

<script>
function runPremiumVerification(){

 const direction=document.getElementById("pv-direction").value;
 const indexValue=Number(document.getElementById("pv-index").value);
 const ce=Number(document.getElementById("pv-ce").value);
 const pe=Number(document.getElementById("pv-pe").value);
 const indexTime=document.getElementById("pv-index-time").value;
 const optionTime=document.getElementById("pv-option-time").value;
 const result=document.getElementById("pv-result");

 if(!indexTime||!optionTime||!indexValue||
    document.getElementById("pv-ce").value===""||
    document.getElementById("pv-pe").value===""){
  result.innerHTML="<strong style='color:#f0c66e'>WAIT — INCOMPLETE DATA</strong><p>All values and candle times are required.</p>";
  return;
 }

 if(indexTime!==optionTime){
  result.innerHTML="<strong style='color:#ff5c70'>NOT VERIFIED — TIME MISMATCH</strong><p>Index and option candles must have exactly the same timestamp.</p>";
  return;
 }

 if(indexValue<=0||ce<0||pe<0){
  result.innerHTML="<strong style='color:#ff5c70'>INVALID INPUT</strong><p>Enter valid positive values.</p>";
  return;
 }

 let selectedPremium=direction==="bullish"?ce:pe;
 let doubledPremium=selectedPremium*2;

 let verified=doubledPremium>=indexValue;

 let optionName=direction==="bullish"?"CE":"PE";

 if(verified){
  result.innerHTML=
  "<strong style='color:#20d68a;font-size:20px'>VERIFICATION PASSED</strong>"+
  "<p>Selected Option: "+optionName+"</p>"+
  "<p>Index Candle Value: "+indexValue.toFixed(2)+"</p>"+
  "<p>"+optionName+" Premium × 2: "+doubledPremium.toFixed(2)+"</p>"+
  "<p>Same candle timestamp confirmed.</p>"+
  "<p>Premium comparison passed. This is verification only, not an entry signal.</p>";
 }else{
  result.innerHTML=
  "<strong style='color:#ff5c70;font-size:20px'>NOT VERIFIED — WAIT</strong>"+
  "<p>Selected Option: "+optionName+"</p>"+
  "<p>Index Candle Value: "+indexValue.toFixed(2)+"</p>"+
  "<p>"+optionName+" Premium × 2: "+doubledPremium.toFixed(2)+"</p>"+
  "<p>Premium comparison failed. Do not treat this as a verified setup.</p>";
 }
}
</script>
<!-- END PREMIUM VERIFICATION MODULE -->
